# Cross-Repo Matrix CI
#
# Runs the Reflector and Void Compressor test suites against the
# current toolkit PR/commit so breaking changes in the toolkit are
# caught before the downstream repos are the ones to notice. The
# matrix clones each peer repo, npm-installs the toolkit from the
# PR SHA, and runs their test suite.
#
# Trigger: trusted owner-controlled pushes and manual dispatch only.
# Private peers are never exposed to pull-request-controlled workflow code.

name: Cross-Repo Matrix

concurrency:
  group: cross-repo-${{ github.ref }}
  cancel-in-progress: true

on:
  # Private peers require ECOSYSTEM_PAT. Keep that credential away from
  # pull-request-controlled code: this matrix runs only on trusted pushes to
  # the canonical branch or this coordinated owner-controlled fix branch.
  push:
    branches:
      - main
      - fix/pr-355-sync-review-findings
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'remembrance.json'
      - '.github/workflows/cross-repo-matrix.yml'
  workflow_dispatch:

jobs:
  reflector-against-toolkit:
    name: Reflector tests against toolkit PR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout toolkit (this PR)
        uses: actions/checkout@v4
        with:
          path: toolkit
          fetch-depth: 1

      - name: Checkout Reflector
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/Reflector-oracle-
          ref: fix/cross-repo-test-failures
          path: reflector
          fetch-depth: 1
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Point Reflector at the PR's toolkit SHA
        working-directory: reflector
        run: |
          # Replace the pinned toolkit dep with a local file reference
          # so Reflector tests the exact code in the PR.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            pkg.dependencies['remembrance-oracle-toolkit'] = 'file:../toolkit';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Install Reflector deps
        working-directory: reflector
        run: npm install --no-audit --no-fund

      - name: Run Reflector tests
        working-directory: reflector
        run: npm test

  void-against-toolkit:
    name: Void ${{ matrix.suite }} against toolkit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [compatibility, contracts]
    env:
      ORACLE_TOOLKIT: ${{ github.workspace }}/ecosystem/remembrance-oracle-toolkit
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          path: ecosystem/remembrance-oracle-toolkit
          fetch-depth: 1

      - name: Checkout Void Compressor
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/Void-Data-Compressor
          ref: fix/pr-355-vdc-contracts-coined
          path: ecosystem/Void-Data-Compressor
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout Reflector
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/Reflector-oracle-
          ref: fix/cross-repo-test-failures
          path: ecosystem/Reflector-oracle-
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout Swarm
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/REMEMBRANCE-AGENT-Swarm-
          ref: fix/ecosystem-contract-sync
          path: ecosystem/REMEMBRANCE-AGENT-Swarm-
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout Blockchain
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/REMEMBRANCE-BLOCKCHAIN
          path: ecosystem/REMEMBRANCE-BLOCKCHAIN
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout Dialer
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/Remembrance-dialer
          ref: fix/ecosystem-contract-sync
          path: ecosystem/Remembrance-dialer
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout MOONS
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/MOONS-OF-REMEMBRANCE
          path: ecosystem/MOONS-OF-REMEMBRANCE
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout API key plugger
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/REMEMBRANCE-API-Key-Plugger
          path: ecosystem/REMEMBRANCE-API-Key-Plugger
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Checkout Interface
        uses: actions/checkout@v4
        with:
          repository: Crackedcoder5TH/REMEMBRANCE-Interface
          path: ecosystem/REMEMBRANCE-Interface
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ECOSYSTEM_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ecosystem/remembrance-oracle-toolkit/package-lock.json

      - name: Install Void dependencies
        working-directory: ecosystem/Void-Data-Compressor
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest maturin
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install toolkit dependencies
        working-directory: ecosystem/remembrance-oracle-toolkit
        run: npm ci --ignore-scripts

      - name: Build canonical substrate decoder
        working-directory: ecosystem/Void-Data-Compressor
        run: |
          python -m maturin build --release --manifest-path substrate-fractal/py/Cargo.toml --out dist
          python -m pip install dist/*.whl

      - name: Seed isolated field state
        working-directory: ecosystem/remembrance-oracle-toolkit
        run: |
          node - <<'NODE'
          const { contribute } = require('./src/core/field-coupling');
          const state = contribute({ source: 'ci:cross-repo-contracts', coherence: 0.9, cost: 1 });
          if (!state) throw new Error('field state was not initialized');
          NODE

      - name: Verify manifests line up
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const tm = JSON.parse(fs.readFileSync('ecosystem/remembrance-oracle-toolkit/remembrance.json', 'utf-8'));
          const vm = JSON.parse(fs.readFileSync('ecosystem/Void-Data-Compressor/remembrance.json', 'utf-8'));
          if (!tm.peers || !tm.peers['void-data-compressor']) {
            throw new Error('Toolkit manifest is missing void-data-compressor peer entry');
          }
          if (vm.role !== 'substrate') {
            throw new Error(`Void manifest role should be substrate, got: ${vm.role}`);
          }
          NODE

      - name: Run Void compatibility tests
        if: matrix.suite == 'compatibility'
        working-directory: ecosystem/Void-Data-Compressor
        run: |
          test -d tests
          find tests -maxdepth 1 -name 'test_*.py' -print -quit | grep -q .
          python -m pytest tests/ -q

      - name: Run the full truth-spine and ratchet family through goggles
        if: matrix.suite == 'contracts'
        working-directory: ecosystem/remembrance-oracle-toolkit
        run: |
          node .claude/skills/goggles/run.mjs --do service start --wait
          node .claude/skills/goggles/run.mjs --do contracts --strict
          node .claude/skills/goggles/run.mjs --do gate contracts
          node .claude/skills/goggles/run.mjs --do ratchets
